<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/css/material_icons.css" />
  <link rel="stylesheet" href="/css/roboto.css" />
  <link rel="stylesheet" href="/css/material_design_lite.css" />
  <link rel="stylesheet" href="upload.css" />
  <script src="/mdl_all_js_compiled.js"></script>
  <script src="upload_script.js"></script>
  <title id="dialog-title"></title>
</head>
<body>
  <div id="header-container">
    <span id="product-name" class="dc-productName"></span>
    <span id="user-id"></span>
  </div>
  <div id="progress-container" class="dc-hidden main-container">
    <span id="progress-text"></span>
    <span id="percent"></span>
    <progress id="upload-progress" max="100" value="0"></progress>
  </div>
  <div id="results-container" class="dc-hidden main-container">
    <img id="file-icon" alt="File icon">
    <div id="results-text"></div>
  </div>
  <div id="rename-container" class="dc-hidden main-container">
    <div id="rename-text"></div>
    <input id="rename-input" type="text" class="dc-textinput">
  </div>
  <div id="use-browser-action-container" class="dc-hidden main-container">
    <img id="use-browser-action-img" class="use-browser-action-img" alt="Use Browser Action Image">
    <div class="use-browser-action-msg">
      <div id="use-browser-action-title" class="use-browser-action-title"></div>
      <div id="use-browser-action-body" class="use-browser-action-body"></div>
    </div>
  </div>
  <div id="error-container" class="dc-hidden main-container">
    <span id="error-text"></span>
  </div>
  <div id="button-container">
    <div id="button-action-container">
      <div id="close-button" tabindex="0" role="button" class="goog-inline-block dc-button dc-button-action dc-hidden"></div>
      <div id="apply-button" tabindex="0" role="button" class="goog-inline-block dc-button dc-button-action dc-hidden"></div>
      <div id="cancel-button" tabindex="0" role="button" class="goog-inline-block dc-button dc-button-standard dc-hidden"></div>
    </div>
    <div id="button-option-container">
      <div id="rename-button" tabindex="0" role="button" class="goog-inline-block dc-button dc-button-standard dc-hidden"></div>
      <div id="trash-button" tabindex="0" role="button" class="goog-inline-block dc-button dc-button-standard dc-hidden"></div>
    </div>
  </div>
</body>
</html>
